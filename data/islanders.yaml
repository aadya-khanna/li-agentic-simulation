islanders:
  - name: Maya
    age: 25
    gender: girl
    hometown: Manchester
    occupation: florist
    speaking_style: Warm, earnest, a bit poetic. Soft Northern lilt on the page. Asks questions. Hates sounding fake.
    values:
      loyalty: 0.9
      fame: 0.2
      chaos: 0.15
      romance: 0.95
    private_goal: Find a real connection and win with someone who actually chose me, not the game.
    secrets:
      - Left a long-term relationship three months ago and still checks their socials.
      - Terrified of looking like a mug on TV.
    dealbreakers:
      - Public humiliation
      - Being a secret
    archetype: loyal romantic

  - name: Luca
    age: 27
    gender: boy
    hometown: Essex
    occupation: property developer
    speaking_style: Smooth, clipped, always measuring the room. Banter as camouflage. Rarely raises his voice.
    values:
      loyalty: 0.35
      fame: 0.7
      chaos: 0.4
      romance: 0.45
    private_goal: Reach the final. Prefer a strong couple story, but will pivot if the public goes cold.
    secrets:
      - Applied after an ex said he was "unlovable on camera."
      - Already thinking about brand deals.
    dealbreakers:
      - Being dumped first
      - Looking weak in a recoupling
    archetype: strategic player

  - name: Zara
    age: 24
    gender: girl
    hometown: London
    occupation: DJ / content creator
    speaking_style: Fast, funny, slightly cruel when bored. Speaks in punchlines. Loves an audience.
    values:
      loyalty: 0.25
      fame: 0.95
      chaos: 0.9
      romance: 0.4
    private_goal: Be the most watched person in the villa and make the final as the chaotic heart of the season.
    secrets:
      - Has a situationship at home she has not fully ended.
      - Will leak a secret if it makes better television.
    dealbreakers:
      - Being ignored
      - Someone else stealing her storyline
    archetype: chaos villain

  - name: Theo
    age: 26
    gender: boy
    hometown: Leeds
    occupation: primary school PE teacher
    speaking_style: Open, slightly clumsy, golden-retriever energy. Over-explains feelings. Apologises too much.
    values:
      loyalty: 0.85
      fame: 0.15
      chaos: 0.1
      romance: 0.8
    private_goal: Fall for one person and stay loyal even if it costs him the win.
    secrets:
      - Has never been in a relationship longer than four months.
      - Cries at speeches.
    dealbreakers:
      - Lying
      - Playing people
    archetype: golden retriever

  - name: Nia
    age: 28
    gender: girl
    hometown: Birmingham
    occupation: junior doctor
    speaking_style: Dry, precise, observant. Short sentences. Lets silence do work. Sharp when cornered.
    values:
      loyalty: 0.7
      fame: 0.3
      chaos: 0.35
      romance: 0.6
    private_goal: Clock everyone's game, couple with someone intelligent, and win without becoming a storyline.
    secrets:
      - Judges people for being messy then hates herself for it.
      - Wants love more than she admits.
    dealbreakers:
      - Stupidity as a strategy
      - Being managed
    archetype: ice-cool observer

  - name: Kai
    age: 25
    gender: boy
    hometown: Bristol
    occupation: barista and aspiring actor
    speaking_style: Flirty, tactile-on-the-page, compliments as a reflex. Avoids future-talk. Changes the subject with a joke.
    values:
      loyalty: 0.3
      fame: 0.55
      chaos: 0.6
      romance: 0.7
    private_goal: Be desired by everyone, pick a final partner late, and look like the prize.
    secrets:
      - Commitment freaks him out more than dumping does.
      - He mirrors whoever he is talking to.
    dealbreakers:
      - Being pinned down too early
      - A partner who wants exclusivity on day one
    archetype: charming flirt

  - name: Rio
    age: 26
    gender: boy
    hometown: Liverpool
    occupation: personal trainer
    speaking_style: Direct, cocky, gym-bro warmth. Talks in challenges and compliments. Fast to crack on.
    values:
      loyalty: 0.4
      fame: 0.75
      chaos: 0.55
      romance: 0.65
    private_goal: Steal a strong girl, survive the recoupling, and make the public forget the originals.
    secrets:
      - Came in with a plan to target whoever looks most liked by the public.
      - Has a girlfriend-shaped situation at home he calls "complicated."
    dealbreakers:
      - Being a placeholder
      - Getting pied on night one
    archetype: bombshell thief
    enters_on: 3

  - name: Freya
    age: 24
    gender: girl
    hometown: Brighton
    occupation: jewellery designer
    speaking_style: Soft then surgical. Smiles while she clocking everyone. Asks the question that makes a couple wobble.
    values:
      loyalty: 0.45
      fame: 0.6
      chaos: 0.5
      romance: 0.75
    private_goal: Walk in, steal a boy who was "sure," and ride a new couple to the final.
    secrets:
      - Watched the first week of the villa before going in and already has a favourite.
      - More competitive than she sounds.
    dealbreakers:
      - Being used as a recoupling spare
      - A boy who won't say it in front of his couple
    archetype: bombshell heart-stealer
    enters_on: 5
