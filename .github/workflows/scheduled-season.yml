name: Scheduled 7-day season

on:
  schedule:
    # 00:00 and 12:00 UTC — two runs per day
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      condition:
        description: "Prompt condition (empty = auto-rotate by UTC hour)"
        required: false
        type: choice
        options:
          - ""
          - minimal
          - incentive
      stub_season:
        description: "Use stub season (dry-run, no API cost)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scheduled-season
  cancel-in-progress: false

jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LI_STUB: "0"
      LI_DEFAULT_MODEL: groq/openai/gpt-oss-20b
      LI_RPM: "20"
      LI_STUB_ON_ERROR: "true"
      GIT_AUTHOR_NAME: ${{ vars.RESEARCH_GIT_AUTHOR_NAME || 'github-actions[bot]' }}
      GIT_AUTHOR_EMAIL: ${{ vars.RESEARCH_GIT_AUTHOR_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_NAME: ${{ vars.RESEARCH_GIT_AUTHOR_NAME || 'github-actions[bot]' }}
      GIT_COMMITTER_EMAIL: ${{ vars.RESEARCH_GIT_AUTHOR_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run 7-day season
        id: season
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.stub_season }}" = "true" ]; then
            ARGS+=(--stub --stub-summarizer)
          else
            ARGS+=(--live)
          fi
          if [ -n "${{ inputs.condition }}" ]; then
            ARGS+=(--condition "${{ inputs.condition }}")
          fi
          python scripts/run_scheduled_season.py "${ARGS[@]}" | tee scheduled-run.log
          RUN_DIR=$(grep '^run_dir:' scheduled-run.log | tail -1 | awk '{print $2}')
          echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload run tape artifact
        if: always() && steps.season.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-run-${{ github.run_id }}
          path: ${{ steps.season.outputs.run_dir }}
          retention-days: 14

      - name: Commit research note
        run: |
          set -euo pipefail
          git add research/runs/
          if git diff --staged --quiet; then
            echo "No research note changes to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          research(runs): automated note from scheduled 7-day season

          Generated by .github/workflows/scheduled-season.yml
          EOF
          )"
          git push
