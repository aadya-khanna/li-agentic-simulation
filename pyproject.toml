[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "li-sim"
version = "0.1.0"
description = "Love Island-style multi-agent social sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "litellm>=1.40.0",
  "langgraph>=0.2.0",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
run-villa = "li_sim.cli:main"
view-villa = "li_sim.web:main"

[tool.setuptools.packages.find]
where = ["src"]
